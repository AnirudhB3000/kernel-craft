name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake make python3 python3-pip git

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake
        working-directory: build
        run: cmake .. -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        working-directory: build
        run: make -j$(nproc)

      - name: Run C++ tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Set up Python
        run: pip install numpy pytest build

      - name: Build Python module
        working-directory: src/python
        run: python -m build

      - name: Run Python tests
        working-directory: src/python
        run: PYTHONPATH=kernel_craft_python:$PYTHONPATH pytest tests/ -v