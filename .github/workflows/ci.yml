name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Build-only job - runs on all pushes
  build-only:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake make python3 python3-pip python3-venv git

      - name: Set up Python
        run: python3 -m pip install numpy pytest build

      - name: Build C++ code
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_CUDA_ARCHITECTURES=75
          make -j$(nproc)

      - name: Build Python module
        working-directory: src/python
        run: python3 -m build

  # GPU tests - only runs when self-hosted runner with GPU is available
  # Set up a self-hosted runner at: Settings > Actions > Runners > New self-hosted runner
  # Use labels: self-hosted,linux,gpu
  gpu-test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache CUDA compute cache
        uses: actions/cache@v4
        with:
          path: ~/.cuda/cache
          key: ${{ runner.os }}-cuda-cache-${{ hashFiles('src/*.cu') }}
          restore-keys: |
            ${{ runner.os }}-cuda-cache-

      - name: Install build dependencies (if missing)
        run: |
          which cmake || sudo apt-get update && sudo apt-get install -y cmake make python3 python3-pip python3-venv git

      - name: Set up Python
        run: python3 -m pip install numpy pytest build

      - name: Build C++ code
        env:
          CUDA_CACHE_PATH: ~/.cuda/cache
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_CUDA_ARCHITECTURES=75
          make -j$(nproc)

      - name: Run C++ tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Build Python module
        working-directory: src/python
        run: python3 -m build

      - name: Run Python tests
        working-directory: src/python
        run: |
          PYTHONPATH="$(pwd)/kernel_craft_python:$PYTHONPATH" python3 -m pytest tests/ -v