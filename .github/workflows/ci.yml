name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Build-only job - runs on all pushes (skip with [skip recipe] in commit message)
  kernel-recipe-check:
    if: "!contains(github.event.head_commit.message, '[skip recipe]')"
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake make python3 python3-pip python3-venv git

      - name: Set up Python
        run: python3 -m pip install numpy pytest build

      - name: Build C++ code
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_CUDA_ARCHITECTURES=75
          make -j$(nproc)

      - name: Build Python module
        working-directory: src/python
        run: python3 -m build

  # GPU tests - only runs when self-hosted runner with GPU is available
  kernel-equipped:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache CUDA compute cache
        uses: actions/cache@v4
        with:
          path: ~/.cuda/cache
          key: ${{ runner.os }}-cuda-cache-${{ hashFiles('src/*.cu') }}
          restore-keys: |
            ${{ runner.os }}-cuda-cache-

      - name: Install build dependencies (if missing)
        run: |
          which cmake || { apt-get update && apt-get install -y cmake make python3 python3-pip python3-venv git; }

      - name: Set up Python
        run: |
          python3 -m venv /tmp/cicvenv
          /tmp/cicvenv/bin/pip install numpy pytest build

      - name: Build C++ code
        env:
          CUDA_CACHE_PATH: ~/.cuda/cache
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_CUDA_ARCHITECTURES=75
          make -j$(nproc)

      - name: Run C++ unit tests
        working-directory: build
        run: make run_unit_tests

      - name: Run C++ integration tests
        working-directory: build
        run: make run_integration_tests

      - name: Build Python module
        working-directory: src/python
        run: /tmp/cicvenv/bin/python -m build

      - name: Run Python unit tests
        working-directory: src/python
        run: /tmp/cicvenv/bin/python -m pytest tests/test_bindings.py tests/test_transformer_bindings.py -v

      - name: Run Python integration tests
        working-directory: src/python
        run: /tmp/cicvenv/bin/python -m pytest tests/test_vllm_backend.py -v
