name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake make python3 python3-pip python3-venv git

      - name: Set up Python
        run: python3 -m pip install numpy pytest build

      - name: Build Python module
        working-directory: src/python
        run: python3 -m build

      - name: Run Python tests
        working-directory: src/python
        run: |
          if nvidia-smi &>/dev/null; then
            PYTHONPATH=kernel_craft_python:$PYTHONPATH python3 -m pytest tests/ -v
          else
            echo "Skipping Python GPU tests (no GPU available)"
          fi