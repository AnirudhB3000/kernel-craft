[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.18"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-craft"
version = "1.0.0"
description = "CUDA kernels for machine learning systems optimization"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = "MIT"
authors = [
    {name = "kernel-craft contributors", email = "contact@example.com"}
]
keywords = ["cuda", "gpu", "convolution", "machine-learning", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "twine>=4.0.0", "build>=1.0.0"]
# Phase 12: vLLM integration extras (requires CUDA ≥ 12.1 and PyTorch ≥ 2.1)
vllm = [
    "torch>=2.1",
    "vllm>=0.5.0",
]
torch = [
    "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/anomalyco/kernel-craft"

# Build tags for different CUDA versions
# Use: pip install kernel-craft --extra-index-url https://download.pytorch.org/whl/cu121
[tool.setuptools.packages.find]
where = ["."]
include = ["kernel_craft_python*", "kernel_craft_python.pyi"]

[tool.setuptools.package-data]
kernel_craft_python = ["*.so", "*.pyi"]